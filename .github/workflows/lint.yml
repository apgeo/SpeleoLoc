name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze:
    name: flutter analyze + refactor guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the analyzer baseline and the golden
          # images were recorded with; a newer SDK brings new lints and
          # different glyph rasterisation, and both read as regressions.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # Held against the recorded backlog rather than zero: errors fail,
        # and so does any increase in the issue count. A bare
        # `flutter analyze` fails on the backlog itself and kept this whole
        # job red, which is how its later steps went unrun.
        run: bash tool/analyze_check.sh

      - name: UI lint
        # Hard-coded user-visible strings and icon buttons without a
        # tooltip, held against tool/ui_lint_baseline.json like analysis.
        run: python3 tool/ui_lint.py

      - name: Format check
        # Repo was bulk-formatted with the Dart 3.10 tall style (commit
        # c046a93); this keeps it that way. Generated *.g.dart files are
        # emitted pre-formatted by build_runner, so no exclusions needed.
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Refactor guardrails
        # Fails when new code outside lib/data/ or lib/services/ uses the
        # global `appDatabase`. Existing call-sites are grandfathered via the
        # baseline file (tool/appdatabase_leakage_baseline.txt); remove them
        # as PRs land.
        run: bash tool/check_appdatabase_leakage.sh

      - name: Tests
        # Excludes the opt-in live FTP integration test (needs a real server;
        # see test/services/ftp_sync_live_test.dart). Known-failing baseline
        # tests are parked with @Skip annotations that reference the plan
        # steps that will fix and re-enable them.
        run: flutter test --exclude-tags live
