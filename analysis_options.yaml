# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by drift_dev. Reviewing/linting the file is pointless
    # (23k+ LOC, fully overwritten by build_runner).
    - lib/data/source/database/app_database.g.dart
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    avoid_print: ignore
    constant_identifier_names: ignore
    curly_braces_in_flow_control_structures: ignore
    depend_on_referenced_packages: ignore
    unintended_html_in_doc_comment: ignore
    unnecessary_underscores: ignore
    # Was blanket-ignored, which hid a real crash class (using a BuildContext
    # after an async gap without a mounted guard). All existing call sites
    # are now guarded, so it is promoted to a build-failing warning to keep
    # new violations out.
    use_build_context_synchronously: warning
    # WS-H3 (2026-07-03): these guardrail lints were previously listed here at
    # `info` but never enabled under `linter.rules`, so the analyzer never ran
    # them (a severity override does not enable a lint). They are now enabled
    # below and enforced as build-failing warnings.
    #
    # `avoid_catches_without_on_clauses` was intentionally dropped: it flagged
    # 187 mostly-deliberate defensive `catch (e)` blocks, is not part of
    # flutter_lints, and enforcing it changes runtime behaviour (Error
    # subtypes would propagate). Revisit as a separate workstream if desired.
    unawaited_futures: warning
    avoid_catching_errors: warning

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

    # Phase 4 — stricter lints to catch unused code and missing consts.
    prefer_const_constructors: true
    prefer_const_declarations: true
    unnecessary_const: true
    # WS-H3 — enable the guardrail rules so the analyzer actually runs them
    # (severity is set to `warning` in `analyzer.errors` above).
    unawaited_futures: true
    avoid_catching_errors: true
    # `unused_element` and `dead_code` are already reported as analyzer diagnostics.

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
