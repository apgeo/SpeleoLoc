name: speleoloc
description: "An application that helps cavers to navigate underground and to document cave systems using QR codes"

publish_to: 'none'

version: 0.2.1+328
environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.1.4
  permission_handler: ^12.0.1
  image_picker: ^1.0.4
  sqflite: ^2.4.2
  path: ^1.9.1
  drift: ^2.30.1
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  intl: ^0.20.2  
  file_picker: ^10.3.8
  image: ^4.0.17
  #qr: ^3.0.2
  pdf: ^3.11.0
  archive: ^3.4.0
  qr_flutter: ^4.0.0
  vector_math: ^2.1.2
  photo_view: ^0.14.0
  # Pinned with a caret rather than `any` so a breaking pdfx release can't be
  # silently pulled in by `pub upgrade` (see refactoring finding 1.3).
  pdfx: ^2.6.0
  restart_app: ^1.3.2
  crypto: ^3.0.2
  csv: ^6.0.0
  pro_image_editor: ^7.0.5
  flutter_quill: ^11.4.0
  flutter_sound: ^9.17.8
  audio_waveforms: ^1.2.1
  package_info_plus: ^8.3.0
  tutorial_coach_mark: 1.3.3
  flutter_riverpod: ^2.6.1
  logging: ^1.2.0
  url_launcher: ^6.3.1
  uuid: ^4.5.3
  # FTP sync (phase A+): ftpconnect for FTP/FTPS, dartssh2 for SFTP,
  # flutter_secure_storage for per-profile passwords.
  ftpconnect: ^2.0.7
  dartssh2: ^2.12.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  flex_color_picker: ^3.7.1
  sentry_flutter: ^9.0.0
  flutter_localizations:
    sdk: flutter
  # BLE beacon support (Beacon Lab / phase 0). Pinned to 0.6.8: 0.6.9 ships a
  # broken android/build.gradle (kotlin{} block without the kotlin-android
  # plugin applied) that fails the Android build. Re-check on newer releases.
  dchs_flutter_beacon: 0.6.8
  flutter_blue_plus: ^2.3.10
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.30.1
  build_runner: ^2.10.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Flutter packages specific section:
flutter:

  uses-material-design: true

  assets:
    # Test data loose files (pre-built sqlite + resource files used by the
    # legacy TestDatabaseLoader path). Commented out so they are NOT bundled
    # into the release binary. Un-comment both lines if you need to re-enable
    # the legacy in-binary test data load (useLegacyTestDataLoad = true).
    # - test_data/maps/
    # - test_data/db/binaries/
    #
    # "Local archive" dev workflow (launch config `speleo_loc_local_archive`,
    # --dart-define-from-file=build_settings_local_archive.json): the DataArchive
    # zip in assets/test_archive/ is bundled so it can be imported on-device via
    # rootBundle. The heavy zip itself is git-ignored (machine-local); only
    # .gitkeep is tracked, so a fresh clone bundles nothing here. NOTE: whatever
    # you drop in assets/test_archive/ is bundled into ALL builds (incl. release)
    # — comment this line out for lean release builds. See
    # docs/workflows/local-test-archive.md.
    - assets/test_archive/
    - assets/fonts/
    - assets/i18n/
